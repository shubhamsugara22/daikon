[package]
name = "rust_kv_store"
version = "0.2.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
actix-web = "4.4"
actix-rt = "2.9"
tokio = { version = "1.33", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = "0.14"
lru = "0.12"
[[bin]]
name = "server"
path = "src/server.rs"
