[package]
name = "rust_kv_store"
version = "0.2.0"
edition = "2021"
default-run = "rust_kv_store"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
actix-web = "4.4"
actix-rt = "2.9"
actix-cors = "0.7"
tokio = { version = "1.33", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = "0.14"
lru = "0.12"
parking_lot = "0.12" # Faster RwLock for concurrent reads
crossbeam = "0.8" # Atomic operations utilities
flate2 = "1.0"
zstd = "0.13"
uuid = { version = "1.6", features = ["v4", "serde"] }
mlua = { version = "0.10", features = ["lua54", "vendored"] }
reqwest = { version = "0.11", features = [
	"blocking",
	"json",
] } # HTTP client for replication

[dev-dependencies]
criterion = { version = "0.5", features = [
	"html_reports",
] } # Performance benchmarking
actix-test = "0.1"
tempfile = "3.8"

[[bench]]
name = "performance"
harness = false

[[bin]]
name = "server"
path = "src/server.rs"
