services:
  daikon:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    environment:
      KV_BIND: "0.0.0.0:8080"
      KV_API_KEY: "${KV_API_KEY:?KV_API_KEY must be set}"
      KV_MAX_MEMORY_BYTES: "1073741824"
      KV_AT_REST_KEY: "${KV_AT_REST_KEY:?KV_AT_REST_KEY must be set}"
      KV_SNAPSHOT_INTERVAL_SECS: "300"
      KV_SNAPSHOT_COMPRESSION: "zstd"
      KV_MAX_PAYLOAD_BYTES: "16777216"
      KV_MAX_CONNECTIONS: "25000"
      KV_RATE_LIMIT_ENABLED: "true"
      KV_RATE_LIMIT_PER_SECOND: "50"
      KV_RATE_LIMIT_BURST: "100"
      KV_ENABLE_LUA: "true"
      KV_TLS_CERT: "${KV_TLS_CERT:-}"
      KV_TLS_KEY: "${KV_TLS_KEY:-}"
      RUST_LOG: "info"
    volumes:
      - daikon-data:/app/data
      - daikon-snapshots:/app/snapshots
    read_only: true
    tmpfs:
      - /tmp:size=64M
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$KV_TLS_CERT" ]; then curl -kfsS https://localhost:8443/api/health/live; else curl -fsS http://localhost:8080/api/health/live; fi',
        ]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  daikon-data:
  daikon-snapshots:
